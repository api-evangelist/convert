            type: object
            properties:
              AND:
                description: This describes a colections of logical blocks which are evaluated using AND's between them
                type: array
                items:
                  type: object
                  properties:
                    OR_WHEN:
                      description: This describes a colections of logical blocks which are evaluated using OR's between them
                      type: array
                      items:
                        $ref: '#/components/schemas/RuleElementAudience'
    GenericNumericKeyValueMatchRulesTypes:

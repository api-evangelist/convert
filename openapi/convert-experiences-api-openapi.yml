      properties:
        devices:
          description: 'A list of device categories the visitor''s device belongs to (e.g., "DESK" for desktop, "IPH" for iPhone, "ALLTAB" for any tablet).

            Based on User-Agent parsing. KB: "Targeting Mobile, Tablet, and Desktop".

            '
          type: array
          items:
            $ref: '#/components/schemas/ReportingSegmentsDeviceCategories'
        browser:
          $ref: '#/components/schemas/ReportingSegmentsBrowser'
        country:

            items:
              $ref: '#/components/schemas/BulkEntityError'
    SimpleAudienceSegment:
      type: object
      properties:
        id:
          description: The unique numerical identifier of the segment (audience).
          type: integer
        name:
          description: The user-defined, friendly name of the segment.
          type: string
    SE_ProcSettingsFrequentist:
      allOf:
      - $ref: '#/components/schemas/SE_ProcSettingsBase'
      - type: object
        description: Stats Engine Settings needed for the Frequentist processing
        properties:
          stats_type:
            enum:
            - frequentist
          confidence:
            description: Confidence value to be used (in percent)
            type: number
            minimum: 50
            maximum: 99
            multipleOf: 1
          power:
            description: Statistical power value to be used (in percent)
            type: number
            minimum: 10
            maximum: 99
            multipleOf: 1
          test_type:
            description: The type of test applied to the data
            type: string
            default: two_tails
            enum:
            - one_tail
            - one_tail_left
            - one_tail_right
            - two_tails
            - sequential
          multiple_comparison_correction:
            description: Multiple comparison correction
            type: string
            enum:
            - none
            - bonferroni
            - sidak
          power_calculation_type:
            description: Power calculation type
            type: string
            default: dynamic_mde
            enum:
            - dynamic_mde
            - fixed_mde
          fixed_mde:
            description: Fixed minimum detectable effect (corresponding to the relative improvement in percent)
            type: number
            minimum: 0
            maximum: 10000
          mab_settings:
            allOf:
            - $ref: '#/components/schemas/SE_MabSettings'
            nullable: true
    BulkEntityError:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: The unique identifier of the entity that could not be processed.
        message:
          type: string
          description: A message explaining the reason for the failure for this specific entity.
    MetricTypes:
      type: string
      description: 'The primary types of performance metrics calculated by the reporting engine for each goal.

        - `conversion_rate`: The percentage of visitors who completed the goal (Conversions / Visitors).

        - `avg_revenue_visitor`: Average Revenue Per Visitor (RPV = Total Revenue / Total Visitors). Applicable for revenue goals.

        - `avg_products_ordered_visitor`: Average Products Per Visitor (APPV = Total Products Ordered / Total Visitors). Applicable for revenue goals tracking product counts.

        - `average_order_value`: Average Order Value (AOV = Total Revenue / Total Conversions). Applicable for revenue goals tracking order value.

        - `average_products_per_order`: Average Products Per Order (APPO = Total Products Ordered Per Visitor / Total Conversions). Applicable for revenue goals tracking product counts.

        Knowledge Base: "Understanding Report Metrics in Convert".

        '
      enum:
      - conversion_rate
      - avg_revenue_visitor
      - avg_products_ordered_visitor
      - average_order_value
      - average_products_per_order
    ChangeHistory:
      type: object
      description: Represents a single logged change event, providing an audit trail for actions performed on Convert entities.
      properties:
        event:
          type: string
          description: The type of action performed (e.g., 'create', 'update', 'delete', 'activate', 'pause').
        info:
          type: object
          description: (Deprecated) Additional context about the change. Modern implementations use the `changes` object.
          deprecated: true
          properties:
            isAdminChange:
              type: boolean
              description: Whether the change was made by a Convert super-admin.
            text:
              type: string
              description: Legacy textual description of the change.
        changes:
          type: object
          description: 'Detailed record of what was modified. Contains `old` and `new` value snapshots for the changed fields.

            For a ''create'' event, `old` will be null. For a ''delete'' event, `new` will be null.

            This allows tracking specific attribute modifications.

            '
          properties:
            old:
              type: object
              description: A snapshot of the relevant fields and their values *before* the change was applied. Null for creation events.
              nullable: true
            new:
              type: object
              description: A snapshot of the relevant fields and their values *after* the change was applied. Null for deletion events.
              nullable: true
        method:
          type: string
          description: 'How the change was initiated: ''api'' (programmatic) or ''app'' (via Convert UI).

            '
          items:
            $ref: '#/components/schemas/ChangeHistoryMethods'
        object:
          type: string
          description: 'The type of Convert entity that was changed (e.g., ''experience'', ''goal'', ''audience'').

            '
        object_id:
          type: string
          description: The unique identifier of the specific entity that was changed.
        parent_object_id:
          type: string
          nullable: true
          description: The unique identifier of the parent entity related to this change. For example, for a 'variation' or 'change', this will be the corresponding 'experience' id.
        user:
          type: string
          description: The name or email of the user (or API key name) that performed the action.
        timestamp:
          type: integer
          description: Unix timestamp (UTC) indicating when the change occurred.
        request_id:
          type: string
          nullable: true
          description: A unique identifier for the specific API request or UI action that resulted in this change, useful for tracing and debugging.
        project:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/SimpleProjectExpandable'
    ProjectIncludeFields:
      type: string
      enum:
      - global_javascript

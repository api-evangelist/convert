        properties:
          type:
            $ref: '#/components/schemas/AudienceTypesNoUrl'
          rules:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/RuleObjectNoUrl'
    VisitorDataExistsMatchRule:
      allOf:
      - $ref: '#/components/schemas/BaseRuleWithBooleanValue'

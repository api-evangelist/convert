          customCode: '#/components/schemas/ExperienceChangeCustomCodeDataAdd'
          defaultCode: '#/components/schemas/ExperienceChangeDefaultCodeDataAdd'
          defaultCodeMultipage: '#/components/schemas/ExperienceChangeDefaultCodeMultipageDataAdd'
          defaultRedirect: '#/components/schemas/ExperienceChangeDefaultRedirectDataAdd'
          fullStackFeature: '#/components/schemas/ExperienceChangeFullStackFeatureAdd'
    Base64Image:
      type: object
      properties:
        data:
          description: The base64 encoded string representation of the image's binary data.
          type: string
    ExperienceTypes:
      type: string
      description: 'The type of optimization activity:

        - `a/b`: Standard A/B test comparing an original page/element against one or more variations. Changes made via Visual Editor or code. KB: "What is an Experiment?".

        - `a/a`: Tests the original page against an identical copy of itself to validate tracking setup and ensure no inherent bias. KB: "A/A Experiments".

        - `mvt`: Multivariate test, testing combinations of changes across multiple sections of a page. KB: "Creating a Multivariate Experiment".

        - `split_url`: Redirects traffic between different URLs to test entirely different page versions. KB: "How do Split URL Experiments work?".

        - `multipage`: Tests a consistent set of changes across a sequence of pages (funnel). KB: "Create Multipage Experiences".

        - `deploy`: Rolls out a specific set of changes to a targeted audience without A/B comparison reporting. KB: "What about Deployments?".

        - `a/b_fullstack`: An A/B test conducted using a Full Stack SDK, potentially involving server-side changes. KB: "Full Stack Experiments on Convert".

        - `feature_rollout`: A Full Stack experience for gradually rolling out a new feature, often using feature flags.

        '
      enum:
      - a/b
      - a/a
      - mvt
      - split_url
      - multipage
      - deploy
      - a/b_fullstack
      - feature_rollout
    AudienceBase:
      type: object
      properties:
        id:
          type: integer
          description: The unique numerical identifier for the audience.
          readOnly: true
        description:
          type: string
          description: An optional, more detailed explanation of the audience's purpose or criteria, aiding in identification and management.
          maxLength: 500
        status:
          $ref: '#/components/schemas/AudienceStatuses'
        name:
          type: string
          description: A user-defined, friendly name for the audience (e.g., "New Visitors from USA", "Repeat Purchasers - Mobile"). This name appears in the Convert UI when selecting audiences for experiences.
          maxLength: 100
        preset:
          type: boolean
          description: Indicates if this audience is a system-defined preset (e.g., "All Visitors", "Mobile Users"). Preset audiences cannot be modified directly but can be used as templates.
          readOnly: true
        selected_default:
          type: boolean
          description: If true, this audience will be automatically pre-selected when creating new experiences within the project. Useful for commonly targeted segments.
        stats:
          type: object
          readOnly: true
          description: Statistics related to the usage of this audience.
          properties:
            experiences_usage:
              description: 'The number of currently active experiences that are using this audience for targeting.

                This is an optional field, included if ''stats.experiences_usage'' is specified in the `include` parameter.

                '
              type: number
              default: 0

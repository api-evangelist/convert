    ExperienceIntegrationEconda:
      allOf:
      - $ref: '#/components/schemas/ExperienceIntegrationBase'
    AudienceTypesNoUrl:
      description: 'Defines the behavior and persistence of an audience that does *not* use URL-based conditions in its rules.

        - `permanent`: Once a visitor matches the audience criteria, they are permanently considered part of this audience for future sessions and evaluations, even if their characteristics change later. The matching is checked only at the initial bucketing time.

        - `transient`: A visitor must match the audience criteria upon each evaluation (e.g., on every page load or when an experiment is rechecked) to be included. If conditions are no longer met, the visitor is no longer part of the audience for that specific evaluation.

        For Full Stack projects, only `transient` and `segmentation` (if applicable without URL rules) are valid.

        '
      type: string
      enum:
      - permanent
      - transient
    GenericListMatchingOptions:
      type: string
      enum:
      - any
      - all
      description: 'Defines how multiple conditions within a list (e.g., multiple audiences or locations linked to an experience) are logically combined:

        - `any`: The overall condition is met if *at least one* item in the list matches (logical OR).

        - `all`: The overall condition is met only if *all* items in the list match (logical AND).

        Default is typically ''any'' (OR).

        '
      default: any
    ExperienceChangeDefaultCodeMultipageDataUpdate:
      type: object

- aid: convert:convert-oauth-authorization-api
  name: Convert OAuth Authorization API
  description: >-
    Delegated authorization endpoints for third-party OAuth clients.


    Typical flow:

    * OAuth client initiates GET request in browser (`/oauth/authorize`) with `client_id` + `response_type=code`
    + `scope` + `state` + `code_challenge` (PKCE)

    * While generating `code_challenge` — don't forget to store the `code_verifier` which will be used
    to obtain the access token

    * User authenticates in Convert and approves scope in consent UI

    * OAuth client exchanges one-time code (`/auth/oauth/token`) for a scoped bearer session token

    * User can list/revoke authorized OAuth sessions (`/auth/oauth/sessions*`)


    Scopes: `selected_accounts_projects`


    Example:

    ```

    https://app.convert.com/auth/oauth/authorize?client_id=1111111&state=randomstring&scope=selected_accounts_projects&response_type=code&code_challenge=generatedCodeChallenge

    ```
  humanURL: https://api.convert.com/doc/v2/
  baseURL: https://api.convert.com/api/v2
  tags:
  - OAuth Authorization
  properties:
  - type: OpenAPI
    url: openapi/convert-oauth-authorization-api-openapi.yml
